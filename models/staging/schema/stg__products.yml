version: 2

models:
  - name: stg__products
    description: '商品データ'
    columns:
      - name: id
        description: '商品ID'
        data_type: INT64
      - name: cost
        description: '原価（USD）'
        data_type: FLOAT64
      - name: category
        description: '商品カテゴリ'
        data_type: STRING
      - name: name
        description: '商品名'
        data_type: STRING
      - name: brand
        description: 'ブランド名'
        data_type: STRING
      - name: retail_price
        description: '小売価格（USD）'
        data_type: FLOAT64
      - name: department
        description: '部門（Men / Women）'
        data_type: STRING
      - name: sku
        description: 'SKUコード'
        data_type: STRING
      - name: distribution_center_id
        description: '配送センターID'
        data_type: INT64
